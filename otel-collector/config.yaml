receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}
  # Day 3 demo: change sampling without touching the apps
  # (make collector-sample-20 -> SAMPLE_PERCENT=20)
  probabilistic_sampler:
    sampling_percentage: ${env:SAMPLE_PERCENT}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [probabilistic_sampler, batch]
      exporters: [otlp/tempo]
